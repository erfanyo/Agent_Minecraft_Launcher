plugins {
    // 迁移到 ForgeGradle 5.1+(与 1.18.2 / 1.19.2 同一套机制)。
    // 原配置用的 ForgeGradle 4.1.16 会从空的 bundeled_repo 解析映射产物,
    // 即使产物已生成也报 Could not find(实测 --refresh-dependencies 也无解)。
    id 'net.minecraftforge.gradle' version '5.1.+'
}

group = 'com.agentmc'
version = '0.2.0'

repositories {
    maven { url = 'https://maven.minecraftforge.net' }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.39'
}

minecraft {
    // 本变体源码用的是 MCP 名(CommandSource / ServerPlayerEntity),
    // 不是 Mojang 官方名,所以必须用 snapshot 映射,不能写 official。
    mappings channel: 'snapshot', version: '20210309-1.16.5'
}

sourceSets.main.java.srcDirs = ['src/main/java']

// Gradle 本身使用 JDK 17；ForgeGradle 的编译任务按游戏版本使用 JDK 8。
java {
    toolchain.languageVersion = JavaLanguageVersion.of(8)
}

// Java 8 编译器不支持 --release，使用 source/target 输出 Java 8 字节码。
tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
}

jar {
    archiveBaseName = 'agentmc-bridge-forge-1.16.5'
    manifest { attributes('Implementation-Version': project.version) }
}
