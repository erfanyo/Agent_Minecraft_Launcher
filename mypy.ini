# mypy config: tighten agent_tools.py + assistant.py (core interfaces)
# usage: python -m mypy --config-file mypy.ini agent_tools.py assistant.py

[mypy]
python_version = 3.14
check_untyped_defs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
show_column_numbers = True
pretty = True
ignore_missing_imports = True

# project-internal modules that import these two; do not strict-check the rest
[mypy-agent_tools]
[mypy-assistant]

[mypy-*.plugin_manager]
follow_imports = skip
