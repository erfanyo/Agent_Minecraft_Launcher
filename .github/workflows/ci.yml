name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 三平台源码 import 冒烟:验证代码能在 Windows/macOS/Linux 加载(offscreen 无显示器)
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (3.14)
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Qt system libs (Linux, offscreen needs EGL/GL)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Offscreen import smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: python ci_smoke.py

  tests:
    name: Full tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python (3.14)
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: requirements-release.txt
      - name: Install tested dependencies
        run: python -m pip install -r requirements-release.txt
      - name: Install Qt system libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Compile Python sources
        run: python -m compileall -q -x "[\\/](build|dist|\.git|\.venv)[\\/]" .
      - name: Run full test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -v

  # Windows 是当前正式发行平台；这里调用与本地发版相同的脚本。
  build:
    name: Windows package validation (manual)
    if: github.event_name == 'workflow_dispatch'
    needs: [smoke, tests]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up release Python (3.14.7)
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: requirements-release.txt
      - name: Install pinned release dependencies
        run: python -m pip install -r requirements-release.txt
      - name: Build and verify unsigned package
        shell: pwsh
        run: |
          .\build_release.ps1 -NoSign -SkipTests -PythonExe (Get-Command python).Source
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentMinecraftLauncher-windows
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/AgentMinecraftLauncher.exe
            dist/AgentMinecraftLauncher-Windows-LocalAI.zip
            dist/SHA256SUMS.txt
            THIRD_PARTY_NOTICES.md

  build-linux:
    name: Linux package validation (manual)
    if: github.event_name == 'workflow_dispatch'
    needs: [smoke, tests]
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up release Python (3.14.7)
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: requirements-release.txt
      - name: Install Linux and pinned Python dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 xvfb xauth
          python -m pip install -r requirements-release.txt
      - name: Build and verify Linux package
        run: bash tools/build_linux.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentMinecraftLauncher-linux-x86_64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist-linux/AgentMinecraftLauncher-linux-x86_64.tar.gz
            dist-linux/SHA256SUMS-linux.txt
