name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 三平台源码 import 冒烟:验证代码能在 Windows/macOS/Linux 加载(offscreen 无显示器)
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (3.14)
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Qt system libs (Linux, offscreen needs EGL/GL)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Offscreen import smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: python ci_smoke.py

  # 打包冒烟:验证 PyInstaller 能构建(当前平台)。跨平台 llama-cpp 二进制待 P1 处理。
  build:
    needs: smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python (3.14)
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build exe (spec)
        run: python -m PyInstaller --noconfirm --clean AgentMinecraftLauncher.spec
      - name: Verify artifact
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\AgentMinecraftLauncher.exe
          if (-not $exe) { throw "no exe built" }
          Write-Host "exe: $($exe.Name) $($exe.Length) bytes"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentMinecraftLauncher-windows
          path: dist/AgentMinecraftLauncher.exe
